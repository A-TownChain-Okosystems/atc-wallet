name: Determinism Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run ATC determinism gate
        run: python3 tools/determinism_check.py --lang rust --test-cmd "cargo test --workspace --quiet"
