[package]
name = "atc_wallet"
version = "0.2.0"
edition = "2021"
description = "A-TownChain wallet core — secp256k1 key management and transaction signing"
authors = ["A-TownChain-Okosystems"]
license = "Apache-2.0"

[dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
egui = "0.36"
getrandom = "0.3"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
